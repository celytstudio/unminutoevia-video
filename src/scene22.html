<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uTime;
uniform vec3 uCamPos, uCamTgt;
uniform float uPool, uWater, uLadderP, uTiles, uHatchY, uFurn, uHatchOpen, uParty; uniform vec4 uCake;
uniform float uDepth;      // hole depth (positive)
uniform float uNight;      // 0 day .. 1 night
uniform vec3 uChar;        // feet position
uniform float uCharRot;    // yaw
uniform float uArm;        // arm swing angle
uniform float uBob;        // body lean
uniform float uShovel;     // 1 has shovel
uniform float uKneel;      // 0..1
uniform float uFlash;      // flashlight on
uniform vec4 uExc;         // excavator x,y,z, visible
uniform float uExcArm;
uniform float uGeyser;     // 0..1 height factor
uniform float uPipeBroken;
uniform float uHatch;      // 0 hidden .. 1 revealed
uniform float uGreen;      // green light intensity
uniform float uLadder;
uniform vec4 uP[14];       // particles xyz r
uniform float uPType;      // 0 dirt 1 water 2 spark
uniform float uEye;
uniform vec4 uRocket;
uniform float uRocketV, uFire, uTilt, uHelm, uCola;
uniform vec3 uGeyPos;
uniform vec4 uTree;
uniform float uBend, uTHStage, uLift;
uniform vec3 uHutPos; uniform float uHutRot, uHutFly;
uniform vec4 uEyes; uniform float uDArm, uRobe;
uniform vec4 uCat; uniform float uCatA, uCatBig, uCatFlip; uniform vec4 uProj; uniform float uProjT;
uniform vec4 uCloud; uniform vec4 uSnow, uSnow2, uArmy, uBall, uBall2; uniform float uSnowHead; uniform float uArmyRot; uniform float uSnowRot, uSnowSmile, uSnowG, uSnowRot2; uniform vec4 uTramp; uniform float uTramp2, uTrampDip;
uniform vec4 uCat2; uniform float uCatA2, uCatBig2, uCatFlip2; uniform vec4 uProj2; uniform float uProjT2;

#define PI 3.14159265

float sdBox(vec3 p, vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdRBox(vec3 p, vec3 b, float r){return sdBox(p,b-r)-r;}
float sdSph(vec3 p,float r){return length(p)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdCylZ(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xy),p.z))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float sdCylY(vec3 p,float r,float h){vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float sdTorusY(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}

// material ids
// 1 grass 2 soil 3 skin 4 shirt 5 jeans 6 eye white 7 pupil 8 hair/beard 9 nose 10 shovel metal 11 wood
// 12 house wall 13 roof 14 fence 15 tree leaves 16 trunk 17 pipe 18 water 19 hatch metal 20 green glow 21 yellow excavator 22 black 23 dirt particle 24 spark 25 ladder 26 window
vec2 U(vec2 a, vec2 b){return a.x<b.x?a:b;}
vec2 snowman(vec3 p, vec4 S, float rot, float smile, float hd){
  float sc=S.w; vec3 q=(p-S.xyz)/sc; float c=cos(rot), s=sin(rot); q.xz=mat2(c,-s,s,c)*q.xz;
  if(length(q-vec3(0,1.1,0))>1.9) return vec2((length(q-vec3(0,1.1,0))-1.8)*sc,0.);
  vec2 r=vec2(1e5,0.);
  float b=min(sdSph(q-vec3(0,0.55,0),0.6),min(sdSph(q-vec3(0,1.35,0),0.42),hd>0.1?sdSph(q-vec3(0,1.95,0),0.3):1e5));
  r=U(r,vec2(b,38.));
  float k=hd>0.1?min(sdSph(q-vec3(0.1,2.02,0.27),0.04),sdSph(q-vec3(-0.1,2.02,0.27),0.04)):1e5;
  k=min(k,min(sdSph(q-vec3(0,1.38,0.42),0.045),min(sdSph(q-vec3(0,1.55,0.37),0.045),sdSph(q-vec3(0,1.2,0.39),0.045))));
  for(int i=0;i<5;i++){ if(hd<0.1) break; float x=(float(i)-2.)*0.06; k=min(k,sdSph(q-vec3(x,1.87+smile*0.06*(x/0.12)*(x/0.12)-0.01*smile,0.275),0.025)); }
  r=U(r,vec2(k,7.));
  if(hd>0.8) r=U(r,vec2(sdCap(q,vec3(0,1.95,0.27),vec3(0,1.93,0.58),0.045),4.));
  r=U(r,vec2(sdTorusY(q-vec3(0,1.72,0),vec2(0.26,0.07)),13.));
  float a=min(sdCap(q,vec3(0.35,1.45,0),vec3(0.85,1.8,0),0.03),sdCap(q,vec3(-0.35,1.45,0),vec3(-0.85,1.8,0),0.03));
  r=U(r,vec2(a,11.));
  r.x*=sc; return r;
}


vec2 character(vec3 p){
  vec3 q=p-uChar;
  if(length(q-vec3(0,1.0,0))>2.2) return vec2(length(q-vec3(0,1.,0))-1.9,0.);
  q.xz=rot(uCharRot)*q.xz;
  float kneel=uKneel;
  // body lean
  vec3 qb=q; qb.y-=0.55*(1.-kneel*0.45);
  qb.yz=rot(uBob)*qb.yz; qb.y+=0.55*(1.-kneel*0.45);
  float ky=-0.28*kneel;
  // legs
  vec2 r=vec2(1e5,0.);
  float legs=min(sdCap(q,vec3(-0.15,0.08,0.0),vec3(-0.15,0.58+ky,0.0+0.2*kneel),0.12),
                 sdCap(q,vec3(0.15,0.08+0.25*kneel,0.3*kneel),vec3(0.15,0.58+ky,0.0+0.2*kneel),0.12));
  r=U(r,vec2(legs,5.));
  float shoes=min(sdEll(q-vec3(-0.15,0.06,0.07),vec3(0.13,0.08,0.2)),sdEll(q-vec3(0.15,0.06+0.25*kneel,0.07+0.3*kneel),vec3(0.13,0.08,0.2)));
  r=U(r,vec2(shoes,22.));
  vec3 bq=qb-vec3(0,0.95+ky,0);
  float body=sdEll(bq,vec3(0.4,0.45,0.3));
  body=smin(body,sdEll(bq-vec3(0,0.15,0),vec3(0.42,0.32,0.3)),0.1);
  r=U(r,vec2(body,4.));
  // head
  vec3 hq=qb-vec3(0,1.62+ky,0.02);
  float head=sdSph(hq,0.36);
  r=U(r,vec2(head,3.));
  float nose=sdSph(hq-vec3(0,-0.02,0.36),0.12);
  r=U(r,vec2(nose,9.));
  float eo=mix(0.085,0.11,uEye);
  vec3 eL=hq-vec3(-0.13,0.1,0.29), eR=hq-vec3(0.13,0.1,0.29);
  float eyes=min(sdSph(eL,eo),sdSph(eR,eo));
  r=U(r,vec2(eyes,6.));
  float pup=min(sdSph(eL-vec3(0,0,eo*0.75),0.045),sdSph(eR-vec3(0,0,eo*0.75),0.045));
  r=U(r,vec2(pup,7.));
  // eyelids (sleepy) when uEye small
  float lid=min(sdSph(eL-vec3(0,0.03,0),eo+0.012),sdSph(eR-vec3(0,0.03,0),eo+0.012));
  lid=max(lid,-(hq.y-0.1-mix(0.02,0.11,uEye)));
  r=U(r,vec2(lid,3.));
  float beard=sdEll(hq-vec3(0,-0.24,0.16),vec3(0.34,0.27,0.26));
  beard=max(beard,-sdSph(hq-vec3(0,-0.02,0.36),0.14));
  beard+=0.02*noise(hq*28.);
  float hair=sdEll(hq-vec3(0,0.14,-0.03),vec3(0.395,0.34,0.39));
  hair=max(hair,-(dot(hq-vec3(0,0.2,0.22),normalize(vec3(0,-0.55,1.)))));
  float ears=min(sdEll(hq-vec3(-0.36,0.0,0.),vec3(0.06,0.1,0.08)),sdEll(hq-vec3(0.36,0.0,0.),vec3(0.06,0.1,0.08)));
  r=U(r,vec2(ears,3.));
  hair+=0.035*noise(hq*18.);
  r=U(r,vec2(min(beard,hair),8.));
  if(uHelm>0.5){ float hm=sdSph(hq-vec3(0,0.02,0),0.5); hm=max(hm,-sdSph(hq-vec3(0,0.0,0.32),0.36)); hm=max(hm,-sdSph(hq,0.47)); hm=min(hm,sdTorusY(hq-vec3(0,-0.42,0),vec2(0.42,0.07))); hm=min(hm,sdCylY(hq-vec3(0,0.52,0),0.08,0.05)); r=U(r,vec2(hm,31.)); }
  float brow=min(sdCap(hq,vec3(-0.21,0.24,0.31),vec3(-0.06,0.22+0.03*uEye,0.34),0.025),sdCap(hq,vec3(0.21,0.24,0.31),vec3(0.06,0.22+0.03*uEye,0.34),0.025));
  r=U(r,vec2(brow,8.));
  // arms
  vec3 sL=vec3(-0.4,1.3+ky,0.), sR=vec3(0.4,1.3+ky,0.);
  float a=uArm;
  vec3 hL=sL+vec3(0.18,-0.45*cos(a),0.45*sin(a)+0.05);
  vec3 hR=sR+vec3(-0.18,-0.45*cos(a+0.25),0.45*sin(a+0.25)+0.05);
  if(uFlash>0.5){ hR=sR+vec3(-0.15,-0.1,0.5); }
  float arms=min(sdCap(qb,sL,hL,0.1),sdCap(qb,sR,hR,0.1));
  r=U(r,vec2(arms,4.));
  float hands=min(sdSph(qb-hL,0.11),sdSph(qb-hR,0.11));
  r=U(r,vec2(hands,22.));
  if(uShovel>0.5){
    vec3 hm=(hL+hR)*0.5;
    vec3 dir=normalize(vec3(0.,-cos(a-0.6),sin(a-0.6)));
    vec3 tip=hm+dir*1.05; vec3 top=hm-dir*0.3;
    r=U(r,vec2(sdCap(qb,top,tip,0.035),11.));
    vec3 bp=qb-(tip+dir*0.15);
    // orient blade: approximate box aligned to dir
    vec3 up=dir; vec3 side=vec3(1,0,0); vec3 fw=normalize(cross(side,up));
    vec3 lb=vec3(dot(bp,side),dot(bp,up),dot(bp,fw));
    r=U(r,vec2(sdRBox(lb,vec3(0.17,0.2,0.025),0.02),10.));
  }
  if(uFlash>0.5){
    r=U(r,vec2(sdCap(qb,hR,hR+vec3(0,-0.05,0.25),0.06),22.));
  }
  return r;
}

vec2 excavator(vec3 p){
  if(uExc.w<0.5) return vec2(1e5,0.);
  vec3 q=p-uExc.xyz; q.x=-q.x;
  if(length(q-vec3(0,1.,0))>3.2) return vec2(length(q-vec3(0,1.,0))-3.,0.);
  vec2 r=vec2(1e5,0.);
  float tr=min(sdRBox(q-vec3(0,0.25,0.45),vec3(1.1,0.25,0.2),0.2),sdRBox(q-vec3(0,0.25,-0.45),vec3(1.1,0.25,0.2),0.2));
  r=U(r,vec2(tr,22.));
  float bd=sdRBox(q-vec3(-0.1,0.75,0),vec3(0.9,0.28,0.6),0.12);
  float cab=sdRBox(q-vec3(-0.35,1.35,0),vec3(0.45,0.42,0.5),0.1);
  float win=sdRBox(q-vec3(-0.35,1.45,0.0),vec3(0.47,0.25,0.4),0.04);
  r=U(r,vec2(min(bd,cab),21.));
  r=U(r,vec2(max(win,-cab+0.02)<0.?win:max(win,cab-0.0)+0.02,26.));
  vec3 j0=vec3(0.6,1.0,0.);
  float a=uExcArm;
  vec3 j1=j0+vec3(0.9*cos(0.9-a*0.3),0.9*sin(0.9-a*0.3),0);
  vec3 j2=j1+vec3(0.7*cos(-0.6-a),0.7*sin(-0.6-a),0);
  float arm=min(sdCap(q,j0,j1,0.13),sdCap(q,j1,j2,0.1));
  r=U(r,vec2(arm,21.));
  vec3 bq=q-j2; bq.xy=rot(a*0.8)*bq.xy;
  float bucket=sdRBox(bq-vec3(0.12,-0.1,0),vec3(0.2,0.18,0.28),0.05);
  bucket=max(bucket,-sdBox(bq-vec3(0.2,0.05,0),vec3(0.15,0.15,0.22)));
  r=U(r,vec2(bucket,22.));
  return r;
}

vec2 mapScene(vec3 p){
  vec2 r=vec2(1e5,0.);
  // ground slab with cutaway front at z=0
  float g=sdBox(p-vec3(0,-4.5,-3.),vec3(9.,4.5,3.));
  // hole box opening towards camera
  float hd=max(uDepth,0.001);
  float hole=sdBox(p-vec3(0.9,-hd*0.5+0.3,-0.8),vec3(1.25,hd*0.5+0.3,1.6));
  g=max(g,-hole);
  if(uPool>0.5){ float pool=sdBox(p-vec3(0.9,-0.45,-1.2),vec3(1.3,0.75,1.4)); g=max(g,-pool); if(uHatchOpen>0.5) g=max(g,-sdCylY(p-vec3(0.9,uHatchY-0.6,-1.0),0.62,0.62)); }
  // dirt piles on surface beside hole
  float pile=sdEll(p-vec3(-1.6,0.,-1.2),vec3(0.3+min(uDepth,5.)*0.18,0.15+min(uDepth,5.)*0.1,0.5+min(uDepth,5.)*0.1));
  pile+=0.03*noise(p*6.);
  float gm = (p.y>-0.18 && g<0.05)?1.:2.;
  if(uPool>0.5 && uTiles>0.5 && abs(p.x-0.9)<1.34 && p.y<0.03 && p.y>-1.24 && p.z>-2.64 && p.z<0.02 && g<0.05) gm=44.;
  r=vec2(g,gm);
  r=U(r,vec2(pile,23.));
  // pipe crossing hole along z at depth 1.6
  float pipe=sdCylZ(p-vec3(0.9,-1.7,-1.5),0.16,1.6);
  if(uPipeBroken>0.5) pipe=max(pipe,-sdBox(p-vec3(0.9,-1.7,-1.0),vec3(0.4,0.4,0.25)));
  if(uPool<0.5) r=U(r,vec2(max(pipe,-p.z-0.001+0.0) ,17.));
  // hatch at bottom
  if(uHatch>0.01){
    vec3 hq=p-vec3(0.9,uHatchY+0.06,-1.0);
    float plate=uHatchOpen>0.5?1e5:sdCylY(hq,0.7,0.06);
    float rim=sdTorusY(hq-vec3(0,0.07,0),vec2(0.68,0.05));
    vec3 wq=hq-vec3(0,0.2,0); wq.xz=rot(uTime*0.3*uHatch*0.)*wq.xz;
    float wheel=uHatchOpen>0.5?1e5:min(sdTorusY(wq,vec2(0.28,0.035)),min(sdCap(wq,vec3(-0.28,0,0),vec3(0.28,0,0),0.025),sdCap(wq,vec3(0,0,-0.28),vec3(0,0,0.28),0.025)));
    if(uHatchOpen<0.5) wheel=min(wheel,sdCylY(hq-vec3(0,0.13,0),0.05,0.08));
    r=U(r,vec2(min(plate,min(rim,wheel)),19.));
    float glow=sdTorusY(hq-vec3(0,0.0,0),vec2(0.73,0.03));
    r=U(r,vec2(glow,20.));
  }
  // ladder
  if(uLadder>0.5){
    vec3 lq=p-vec3(1.95,-uDepth*0.5+0.4,-1.2);
    float rails=min(sdCap(lq,vec3(-0.25,-uDepth*0.5-0.1,0),vec3(-0.25,uDepth*0.5+0.5,0),0.04),sdCap(lq,vec3(0.25,-uDepth*0.5-0.1,0),vec3(0.25,uDepth*0.5+0.5,0),0.04));
    vec3 rq=lq; rq.y=mod(rq.y+0.2,0.4)-0.2;
    float rungs=max(sdCap(rq,vec3(-0.25,0,0),vec3(0.25,0,0),0.03),abs(lq.y)-uDepth*0.5-0.4);
    r=U(r,vec2(min(rails,rungs),25.));
  }
  if(abs(p.z+5.15)<0.7 && p.y<1.2 && p.x>-1.4 && p.x<8.4){
    vec3 bq=p-vec3(0.,0.,-5.15); float cid=floor(bq.x/0.7+0.5); bq.x-=cid*0.7; bq.x=clamp(bq.x,-0.35,0.35)+ (bq.x-clamp(bq.x,-0.35,0.35));
    float bush=sdEll(bq-vec3(0.,0.32,0.),vec3(0.42,0.36,0.34))+0.04*noise(p*9.);
    r=U(r,vec2(bush,15.));
    vec3 fq=bq; fq.xy-=vec2(sin(cid*3.1)*0.15,0.55); float fl=sdSph(fq,0.07); fl=min(fl,sdSph(fq-vec3(-0.22,-0.12,0.2),0.06)); fl=min(fl,sdSph(fq-vec3(0.2,-0.18,0.22),0.06));
    r=U(r,vec2(fl,45.+fract(cid*0.37)*0.9));
  }
  if(uPool>0.5 && uTiles>0.5){ float rim=max(sdBox(p-vec3(0.9,0.03,-1.35),vec3(1.5,0.05,1.5)),-sdBox(p-vec3(0.9,0.03,-1.3),vec3(1.3,0.2,1.3)));
    rim=max(rim,p.z-0.0); r=U(r,vec2(rim-0.01,14.)); }
  if(uCake.w>0.){ vec3 cq=(p-uCake.xyz)/uCake.w;
    float ck=min(sdCylY(cq-vec3(0,0.12,0),0.42,0.12),min(sdCylY(cq-vec3(0,0.36,0),0.3,0.12),sdCylY(cq-vec3(0,0.57,0),0.19,0.09)));
    r=U(r,vec2((ck-0.02)*uCake.w,14.));
    float band=min(sdTorusY(cq-vec3(0,0.22,0),vec2(0.42,0.03)),sdTorusY(cq-vec3(0,0.46,0),vec2(0.3,0.03))); r=U(r,vec2(band*uCake.w,13.));
    float cand=1e5, fl=1e5; for(int i=0;i<5;i++){ float a=float(i)*1.2566; vec3 c0=vec3(cos(a)*0.11,0.66,sin(a)*0.11); cand=min(cand,sdCap(cq,c0,c0+vec3(0,0.14,0),0.018)); fl=min(fl,sdEll(cq-c0-vec3(0,0.19,0),vec3(0.025,0.045,0.025))); }
    r=U(r,vec2(cand*uCake.w,9.)); r=U(r,vec2(fl*uCake.w,21.)); }
  if(uParty>0.5 && abs(p.z+2.75)<0.3 && p.y>0.8 && p.y<2.2 && p.x>-0.9 && p.x<2.7){
    float xx=p.x-0.9; float wy=1.75-0.3*(1.-(xx/1.6)*(xx/1.6));
    float wire=length(vec2(p.y-wy,p.z+2.75))-0.012; r=U(r,vec2(wire,22.));
    float id=floor(p.x/0.32+0.5); vec3 bq=p-vec3(id*0.32,0.,-2.75); float bx=id*0.32-0.9; bq.y-=1.75-0.3*(1.-(bx/1.6)*(bx/1.6))-0.07;
    r=U(r,vec2(sdSph(bq,0.055),47.+fract(id*0.37)*0.9)); }
  if(uFurn>0.5){ vec3 fq=p-vec3(0.6,-1.2,-2.15);
    float sofa=sdBox(fq-vec3(0,0.18,0),vec3(0.6,0.14,0.28))-0.04; sofa=min(sofa,sdBox(fq-vec3(0,0.42,-0.22),vec3(0.6,0.22,0.07))-0.04);
    sofa=min(sofa,min(sdBox(fq-vec3(0.6,0.3,0),vec3(0.07,0.18,0.28))-0.03,sdBox(fq-vec3(-0.6,0.3,0),vec3(0.07,0.18,0.28))-0.03));
    r=U(r,vec2(sofa,13.)); }
  if(uFurn>1.5){ vec3 lq=p-vec3(1.6,-1.2,-2.25);
    r=U(r,vec2(min(sdCap(lq,vec3(0,0,0),vec3(0,0.75,0),0.025),sdCylY(lq,0.14,0.02)),10.));

vec3 calcN(vec3 p){vec2 e=vec2(0.0015,0);
 return normalize(vec3(mapScene(p+e.xyy).x-mapScene(p-e.xyy).x,mapScene(p+e.yxy).x-mapScene(p-e.yxy).x,mapScene(p+e.yyx).x-mapScene(p-e.yyx).x));}

float shadow(vec3 ro, vec3 rd){float res=1.,t=0.03;
 for(int i=0;i<28;i++){float h=mapScene(ro+rd*t).x;res=min(res,10.*h/t);t+=clamp(h,0.04,0.6);if(res<0.01||t>14.)break;}
 return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<5;i++){float h=0.07*float(i);o+=(h-mapScene(p+n*h).x)*s;s*=0.6;}return clamp(1.-2.2*o,0.,1.);}

vec3 matCol(float m, vec3 p){

  if(m<10.5) return vec3(0.6,0.63,0.68);
  if(m<11.5) return vec3(0.5,0.32,0.18);
  if(m<12.5) return vec3(0.93,0.88,0.78);
  if(m<13.5) return vec3(0.72,0.25,0.2);
  if(m<14.5) return vec3(0.92,0.9,0.85);
  if(m<15.5) return vec3(0.25,0.55,0.25)*(0.8+0.4*noise(p*6.));
  if(m<16.5) return vec3(0.4,0.26,0.15);
  if(m<17.5) return vec3(0.45,0.5,0.55);
  if(m<18.5) return vec3(0.55,0.8,1.0);
  if(m<19.5) return vec3(0.35,0.37,0.36)*(0.7+0.5*noise(p*10.))+vec3(0.15,0.07,0.)*noise(p*4.);
  if(m<20.5) return vec3(0.3,1.0,0.4);
  if(m<21.5) return vec3(1.0,0.75,0.1);
  if(m<22.5) return vec3(0.08,0.08,0.09);
  if(m<23.5) return vec3(0.5,0.32,0.18)*(0.8+0.4*noise(p*12.));
  if(m<24.5) return vec3(1.,0.85,0.3);
  if(m<25.5) return vec3(0.7,0.5,0.3);
  if(m<26.5) return vec3(0.55,0.75,0.9);
  if(m<31.5) return vec3(0.78,0.55,0.22);
  if(m<32.5) return vec3(0.12,0.16,0.3);
  if(m<33.5) return vec3(0.92,0.93,0.95);
  if(m<34.5) return vec3(0.8);
  if(m<35.5) return vec3(0.35,0.42,0.38)*(0.85+0.3*step(0.5,fract(p.y*6.)));
  if(m<36.5) return mix(vec3(1.,0.45,0.05),vec3(1.),step(0.8,fract(p.y*4.)));
  if(m<38.5) return vec3(1.0);
  if(m<39.5) return vec3(0.35,0.18,0.08);
  if(m<40.5) return vec3(0.2,0.1,0.05);
  if(m<41.5) return vec3(0.6,0.78,0.92);
  if(m<42.5) return mix(vec3(0.1,0.45,0.12),vec3(0.35,0.7,0.25),step(0.5,fract(atan(p.z-uProj.z,p.y-uProj.y)*2.5)));
  if(m<44.5){ vec2 tq=fract(vec2(p.x+p.z,p.y)*4.); float gr=step(0.06,tq.x)*step(0.06,tq.y); return mix(vec3(0.85,0.9,0.95),vec3(0.25,0.62,0.85)*(0.9+0.15*noise(p*8.)),gr); }
  if(m>=47.){ float f=fract(m); return f<0.3?vec3(1.,0.3,0.3):(f<0.6?vec3(0.3,1.,0.4):vec3(1.,0.85,0.2)); }
  if(m<46.){ float f=fract(m); return f<0.3?vec3(1.,0.35,0.55):(f<0.6?vec3(1.,0.85,0.2):vec3(0.95,0.95,1.)); }
  return vec3(0.9,0.12,0.08);
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;
  vec3 ro=uCamPos; vec3 fw=normalize(uCamTgt-ro); vec3 rt=normalize(cross(fw,vec3(0,1,0))); vec3 up=cross(rt,fw);
  vec3 rd=normalize(fw*2.0+uv.x*rt+uv.y*up);
  // sky
  vec3 skyD=mix(vec3(0.55,0.78,0.98),vec3(0.25,0.5,0.9),clamp(rd.y*1.5,0.,1.));
  vec3 skyN=mix(vec3(0.08,0.1,0.22),vec3(0.02,0.03,0.08),clamp(rd.y*1.5,0.,1.));
  vec3 sunDir=normalize(vec3(0.55,0.85,0.6));
  skyD=mix(skyD,vec3(1.0,0.86,0.7),pow(1.-clamp(rd.y,0.,1.),5.)*0.25);
  skyD+=vec3(1.,0.85,0.6)*pow(clamp(dot(rd,sunDir),0.,1.),60.)*0.6+vec3(1.,0.9,0.7)*pow(clamp(dot(rd,sunDir),0.,1.),6.)*0.12;
  if(rd.y>0.){ vec2 cp=rd.xz/(rd.y+0.08)*1.3+vec2(uTime*0.02,0.); float cn=noise(vec3(cp,0.))*0.55+noise(vec3(cp*2.1,1.))*0.3+noise(vec3(cp*4.3,2.))*0.15;
    float cm=smoothstep(0.55,0.78,cn)*smoothstep(0.0,0.25,rd.y); skyD=mix(skyD,vec3(1.,0.98,0.95)-0.12*(1.-cn),cm*0.85); }
  vec3 sky=mix(skyD,skyN,uNight);
  vec3 col=sky;
  float t=0.1; vec2 h; bool hit=false;
  for(int i=0;i<110;i++){ h=mapScene(ro+rd*t); if(abs(h.x)<0.0012*t){hit=true;break;} t+=h.x*0.9; if(t>40.)break; }
  if(hit){
    vec3 p=ro+rd*t; vec3 n=calcN(p); float m=h.y;
    vec3 alb=matCol(m,p);
    vec3 sunD=normalize(vec3(0.55,0.85,0.6));
    vec3 sunC=mix(vec3(1.7,1.45,1.15),vec3(0.18,0.22,0.45),uNight);
    float dif=clamp(dot(n,sunD),0.,1.);
    float sh= dif>0.001? shadow(p+n*0.01,sunD):0.;
    float occ=ao(p,n);
    vec3 amb=mix(vec3(0.32,0.4,0.55),vec3(0.05,0.07,0.15),uNight);
    float wrapd=(m==3.||m==9.)?clamp((dot(n,sunD)+0.35)/1.35,0.,1.):dif;
    vec3 skyAmb=mix(mix(vec3(0.30,0.36,0.30),vec3(0.42,0.52,0.72),0.5+0.5*n.y),vec3(0.05,0.07,0.15),uNight);
    vec3 lin=sunC*wrapd*mix(sh,1.,(m==3.||m==9.)?0.25:0.) + skyAmb*occ*(0.75+0.25*n.y) + vec3(0.32,0.42,0.18)*occ*clamp(-n.y,0.,1.)*0.5*(1.-uNight);
    if(m==3.||m==9.) lin+=vec3(0.35,0.08,0.04)*occ*(1.-uNight)*0.5;
    if(uPool>0.5 && uWater>0.01 && p.y< -1.2+1.08*uWater && abs(p.x-0.9)<1.35 && p.z>-2.65 && p.z<0.05 && n.y>-0.5){
      vec3 cq=vec3(p.xz*3.2,uTime*0.8); float c1=noise(cq)+noise(cq*1.9+3.); float ca=pow(1.-abs(c1-1.),6.);
      lin+=vec3(0.7,0.95,1.)*ca*0.9*(1.-uNight)*smoothstep(-1.4,-0.6,p.y)+vec3(0.,0.04,0.06); }
    // rim
    float fre=pow(clamp(1.+dot(n,rd),0.,1.),3.);
    lin+=fre*occ*mix(vec3(0.6,0.7,0.9),vec3(0.2,0.6,0.3)*uGreen,uNight)*0.5;
    // green point light from hatch
    if(uGreen>0.01){
      vec3 lp=vec3(0.9,uHatchY+0.5,-0.9); vec3 ld=lp-p; float dl=length(ld); ld/=dl;
      float gd=clamp(dot(n,ld),0.,1.);
      lin+=vec3(0.3,1.0,0.4)*uGreen*gd*1.1/(1.+dl*dl*0.9);
    }
    // flashlight warm light from character head direction
    if(uFlash>0.5){
      vec3 lp=uChar+vec3(0.3,1.6,1.0); vec3 ld=lp-p; float dl=length(ld); ld/=dl;
      lin+=vec3(1.,0.85,0.65)*clamp(dot(n,ld),0.,1.)*1.6/(1.+dl*dl*0.5);
    }
    // specular
    vec3 hv=normalize(sunD-rd); float sp=pow(clamp(dot(n,hv),0.,1.),32.)*sh*dif;
    float spk=(m==10.||m==19.||m==18.||m==6.||m==21.||m==31.||m==33.||m==39.)?0.6:((m==3.||m==4.||m==5.||m==41.)?0.18:0.08);
    col=alb*lin+sp*spk*sunC;
    if(m==20.) col=vec3(0.4,1.4,0.5)*uGreen*1.6+alb*0.1;
    if(m==21. && uFurn>1.5 && p.y<0.) col=vec3(2.2,1.7,0.8);
    if(m==21. && uCake.w>0. && length(p-uCake.xyz)<1.2*uCake.w+0.3) col=vec3(2.6,1.8,0.6);
    if(m>=47.) col=alb*2.6;
    if(uHatchOpen>0.5 && m==2. && length(p.xz-vec2(0.9,-1.0))<0.75 && p.y< uHatchY+0.1) col=vec3(0.4,1.6,0.6);
    if(m==24. && uFurn>1.5 && p.y<0.) col=vec3(2.4,2.0,1.1); else if(m==24.) col=mix(vec3(2.2,1.8,0.7),vec3(2.0,0.6,0.1),clamp(-(p.y-uRocket.y)/(1.5*uRocket.w+0.01),0.,1.));
    if(m==38.) col=mix(col,vec3(1.),0.35);
    if(m==30.) col=vec3(0.15,0.12,0.1);
    if(m==26.) col=mix(vec3(0.6,0.8,1.0)*0.9,vec3(1.0,0.8,0.4)*0.9,uNight)+sp*0.5;
    if(m==18.) col=mix(col,vec3(0.75,0.92,1.0),0.35);
    // fog
    col=mix(col,mix(sky,vec3(0.85,0.82,0.78),0.15*(1.-uNight)),1.-exp(-0.0005*t*t));
  }
  // green volumetric glow approx in screen
  if(uGreen>0.01){
    vec3 lp=vec3(0.9,uHatchY+0.4,-0.9);
    vec3 w=lp-ro; float tt=max(dot(w,rd),0.); float d=length(w-rd*tt);
    if(!hit || t>tt-0.5) col+=vec3(0.2,0.9,0.35)*uGreen*0.22*exp(-d*d*2.5);
  }
  if(uPool>0.5 && uWater>0.01){
    vec3 bmin=vec3(-0.4,-1.2,-2.6), bmax=vec3(2.2,-1.2+1.08*uWater,0.0);
    vec3 i1=(bmin-ro)/rd, i2=(bmax-ro)/rd; vec3 tn=min(i1,i2), tf=max(i1,i2);
    float t0=max(max(tn.x,tn.y),tn.z), t1=min(min(tf.x,tf.y),tf.z);
    float tend=hit?t:1e4;
    if(t1>max(t0,0.) && t0<tend){ float d=min(t1,tend)-max(t0,0.);
      vec3 ent=ro+rd*max(t0,0.);
      vec3 wc=mix(vec3(0.1,0.55,0.8),vec3(0.02,0.08,0.2),uNight);
      col=mix(col,wc,1.-exp(-d*0.9));
      if(abs(ent.y-bmax.y)<0.01){ float rip=noise(vec3(ent.xz*6.,uTime*1.5))*noise(vec3(ent.xz*3.-uTime,1.)); col+=vec3(0.9,0.95,1.)*smoothstep(0.35,0.6,rip)*0.25*(1.-uNight); col=mix(col,sky,0.25); }
      if(abs(ent.z)<0.01){ col+=vec3(0.6,0.9,1.)*0.08; } } }
  // ACES-ish tonemap
  col*=0.7; col=(col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);
  float lu=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(lu),col,1.38); col*=vec3(1.03,1.0,0.97);
  col=pow(clamp(col,0.,1.),vec3(0.4545));
  // vignette
  vec2 q=gl_FragCoord.xy/uRes; col*=0.55+0.45*pow(16.*q.x*q.y*(1.-q.x)*(1.-q.y),0.2);
  fragColor=vec4(col,1);
}
</script>
<script>
const glc=document.getElementById('gl');
const gl=glc.getContext('webgl2',{preserveDrawingBuffer:true});
const vs=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const L={};function u(n){return L[n]||(L[n]=gl.getUniformLocation(prog,n));}
window.renderGL=function(S){
  gl.viewport(0,0,glc.width,glc.height);
  gl.uniform2f(u('uRes'),glc.width,glc.height);
  for(const [k,v] of Object.entries(S)){
    if(k==='uP'){gl.uniform4fv(u('uP[0]'),new Float32Array(v));continue;}
    const loc=u(k); if(!loc) continue;
    if(typeof v==='number') gl.uniform1f(loc,v);
    else if(v.length===3) gl.uniform3fv(loc,v);
    else if(v.length===4) gl.uniform4fv(loc,v);
  }
  gl.drawArrays(gl.TRIANGLES,0,3);
};
const oc=document.getElementById('out').getContext('2d');
function wrap(ctx,text,maxW){const w=text.split(' ');const lines=[];let cur='';for(const x of w){const t=cur?cur+' '+x:x;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=x}else cur=t}if(cur)lines.push(cur);return lines;}
window.compose=function(T){
  oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality='high';
  oc.filter='saturate(1.08) contrast(1.08)'; oc.drawImage(glc,0,0,1080,1920); oc.filter='none';
  oc.save(); oc.globalCompositeOperation='soft-light'; oc.globalAlpha=0.18; const gg=oc.createLinearGradient(0,0,0,1920); gg.addColorStop(0,'#ffd9a0'); gg.addColorStop(1,'#5a7fb0'); oc.fillStyle=gg; oc.fillRect(0,0,1080,1920); oc.restore();
  oc.save(); oc.globalCompositeOperation='screen'; oc.globalAlpha=0.13; oc.filter='blur(22px) brightness(1.1) contrast(1.8)'; oc.drawImage(glc,0,0,1080,1920); oc.restore(); oc.filter='none';
  if(T.flash>0){oc.fillStyle=`rgba(255,255,255,${T.flash})`;oc.fillRect(0,0,1080,1920);}
  if(T.dark>0){oc.fillStyle=`rgba(0,0,0,${T.dark})`;oc.fillRect(0,0,1080,1920);}
  for(const it of (T.texts||[])){
    oc.save();
    oc.font=`${it.size}px P`;oc.textAlign='center';oc.textBaseline='middle';
    const lines=wrap(oc,it.text,960);
    const lh=it.size*1.15; let y=it.y-(lines.length-1)*lh/2;
    oc.globalAlpha=it.alpha??1;
    oc.translate(540,it.y); oc.scale(it.scale??1,it.scale??1); oc.translate(-540,-it.y);
    for(const ln of lines){
      oc.lineJoin='round';oc.lineWidth=it.size*0.22;oc.strokeStyle='rgba(0,0,0,0.9)';oc.strokeText(ln,540,y);
      oc.fillStyle=it.color||'#fff';oc.fillText(ln,540,y);y+=lh;}
    oc.restore();
  }
  return document.getElementById('out').toDataURL('image/jpeg',0.9);
};
